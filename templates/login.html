<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinicFlow Admin Login</title><style>body{font:16px system-ui;background:#edf7f7;display:grid;place-items:center;min-height:90vh}form{background:white;padding:30px;border-radius:16px;max-width:360px;width:90%;box-shadow:0 10px 30px #1232}input,button{width:100%;box-sizing:border-box;padding:12px;margin:12px 0;border-radius:8px}button{background:#078c85;color:white;border:0}</style></head><body><form id="f"><h2>ClinicFlow Admin</h2><p>Enter the password from your .env file.</p><input type="password" id="password" required placeholder="Admin password"><button>Sign in</button><p id="msg"></p><a href="/">Back to booking</a></form><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let j=await r.json();if(r.ok)location.href='/admin';else document.getElementById('msg').textContent=j.error}</script></body></html>
